[project]
name = "studio-contracts"
version = "0.1.1"
description = "Pydantic models, error codes and enums shared by the Studio worker and server"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.11"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["studio_contracts"]
