# Alembic configuration for the Studio server database (S-8).
#
#   STUDIO_DATA_DIR=<dir> alembic -c server/alembic.ini upgrade head
#
# The database is <STUDIO_DATA_DIR>/studio.db (default ~/.studio); env.py reads it from
# the server settings, so no URL is set here. The server also runs "upgrade head" itself
# at startup.
[alembic]
script_location = %(here)s/studio_server/migrations
