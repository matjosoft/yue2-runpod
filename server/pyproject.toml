[project]
name = "studio-server"
version = "0.1.0"
description = "Studio local server: settings, library and worker client"
requires-python = ">=3.12"
dependencies = [
    "studio-contracts",
    "fastapi>=0.120",
    "uvicorn>=0.38",
]

[tool.uv.sources]
studio-contracts = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["studio_server"]
