[project]
name = "studio-worker"
version = "0.1.1"
description = "Studio GPU worker: generic job API over music engines"
requires-python = ">=3.12"
# yue2_infer (and its torch pin) is deliberately absent: it is installed only in the
# worker Docker image (M4). See docs/yue2-api-notes.md and docs/decisions.md.
dependencies = [
    "studio-contracts",
    "fastapi>=0.120",
    "uvicorn>=0.38",
    # FakeEngine writes FLAC. Bounds match the yue2 wheel's pins (numpy==2.2.6,
    # soundfile==0.13.1) so the M4 image resolves without conflict.
    "numpy>=2.2,<2.3",
    "soundfile>=0.13.1,<0.14",
]

[tool.uv.sources]
studio-contracts = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["studio_worker"]
